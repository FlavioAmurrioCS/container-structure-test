# yaml-language-server: $schema=https://www.schemastore.org/pre-commit-config.json
---
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    # Diffs are excluded from the fixers: a blank context line in a hunk is a
    # single space, and format-patch's "-- " signature has one too. Stripping
    # either corrupts the patch, and the build applies patches/ with no fuzz.
    -   id: trailing-whitespace
        exclude_types: [diff]
    -   id: end-of-file-fixer
        exclude_types: [diff]
    -   id: check-yaml
    -   id: check-added-large-files
